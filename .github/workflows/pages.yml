name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The repo is public, but the site gets only what index.html loads: speech.md, script.md and
      # the paper PDF stay off it, and so does the rest of the vendored reveal.js tree.
      - name: Collect the deck
        run: |
          mkdir -p _site/css
          cp index.html _site/
          cp -r css/custom _site/css/
          cp -r dist lib _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
